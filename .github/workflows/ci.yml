name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m py_compile api_comparator/*.py scripts/*.py tests/*.py

      - name: Validate example config JSON
        run: python -m json.tool config/api_targets.example.json

      - name: Run tests
        run: python -m unittest discover -s tests
